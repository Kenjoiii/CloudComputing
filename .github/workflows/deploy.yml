name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: self-hosted # Ini akan mengarahkan job ke EC2 runner kamu

    env:
      AWS_REGION: us-east-1 # Sesuaikan dengan region Learner Lab kamu
      ECR_REPOSITORY: CloudComputing-ECR # Sesuaikan dengan nama repo ECR kamu

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        # Runner otomatis memakai LabRole dari EC2 Instance Profile

      - name: Build, Tag, and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
